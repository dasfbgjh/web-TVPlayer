<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>TV Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: #0a0a10;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI Variable', 'Segoe UI', sans-serif;
        }

        .splash {
            text-align: center;
            color: rgba(255, 255, 255, 0.774);
        }

        .splash-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }

        .splash-text {
            font-size: 14px;
            letter-spacing: 4px;
        }
    </style>
</head>

<body>
    <div class="splash">
        <div class="splash-icon">📺</div>
        <div class="splash-text">选择节目开始播放</div>
    </div>
</body>

</html>
